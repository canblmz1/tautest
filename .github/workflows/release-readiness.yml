name: Release Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".changeset/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/workflows/**"
      - "docs/**"
      - "examples/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Changesets config
        run: pnpm changeset status --since=origin/main

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage report
        run: pnpm coverage

      - name: Upload coverage summaries
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summaries-node-${{ matrix.node-version }}
          path: |
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Pack npm packages
        run: |
          mkdir -p .tautest/release-packs
          pnpm --filter @tautest/core pack --pack-destination .tautest/release-packs
          pnpm --filter tautest pack --pack-destination .tautest/release-packs

      - name: Smoke packed npm packages
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          pack_dir="$(pwd)/.tautest/release-packs"
          core_tgz="$(find "$pack_dir" -maxdepth 1 -name 'tautest-core-*.tgz' -print -quit)"
          cli_tgz="$(find "$pack_dir" -maxdepth 1 -name 'tautest-[0-9]*.tgz' -print -quit)"
          test -n "$core_tgz"
          test -n "$cli_tgz"
          cat > "$smoke_dir/package.json" <<JSON
          {
            "name": "tautest-release-smoke",
            "private": true,
            "type": "module",
            "dependencies": {
              "@tautest/core": "file:$core_tgz",
              "tautest": "file:$cli_tgz"
            },
            "pnpm": {
              "overrides": {
                "@tautest/core": "file:$core_tgz"
              }
            }
          }
          JSON
          pnpm -C "$smoke_dir" install --ignore-scripts
          pnpm -C "$smoke_dir" exec tautest --version
          cd "$smoke_dir"
          node --input-type=module -e "import('@tautest/core').then((m) => { if (!m.buildMarkdownReport) throw new Error('missing core export'); })"

      - name: Create local diff for action smoke
        shell: bash
        run: perl -0pi -e "s/age >= 65/age >= 65 /" examples/vitest-basic/src/discount.ts

      - name: Local GitHub Action smoke
        uses: ./packages/github-action
        with:
          base: HEAD
          threshold: 60
          fail-on-threshold: false
          comment: never
          working-directory: examples/vitest-basic
          package-manager: pnpm
          install: false
          cache: false
