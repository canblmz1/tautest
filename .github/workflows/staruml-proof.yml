name: Adoption proof - StarUML extension port

on:
  push:
    branches: [evidence/triad-address]
    paths:
      - .github/workflows/staruml-proof.yml
      - scripts/adoption-proof/staruml/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false
      - name: Checkout inspected project revision
        uses: actions/checkout@v4
        with:
          repository: hqqw2h-lgtm/staruml-mcp
          ref: 3a58d812d7c52b559ac920bf17fc0fa1cf19dcf3
          path: project
          persist-credentials: false
      - name: Install project dependencies without lifecycle scripts
        working-directory: project
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install separate proof tools
        working-directory: scripts/adoption-proof/staruml
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove the original survivor and candidate kill
        run: node scripts/adoption-proof/staruml/prove-port.mjs "$GITHUB_WORKSPACE/project"
      - name: Publish scoped evidence summary
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('project/.tautest/adoption-proof/evidence.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# StarUML extension-port proof', '', 'Maintainer-run experiment; not external adoption.', '',
            `Revision: ${p.head}`, '', `Scope: ${p.scope}`, '',
            `Before: ${JSON.stringify(p.before)}`, '', `After: ${JSON.stringify(p.after)}`, '',
            `Verification: ${p.verification.status}; testsCompleted=${p.verification.testsCompleted}`, '',
            `Killing tests: ${JSON.stringify(p.killingTests)}`, '', `Production source unchanged: ${p.sourceUnchanged}`
          ].join('\n'));
          NODE
      - name: Upload reports and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staruml-port-proof
          path: |
            project/.tautest/adoption-proof/
            project/.tautest/verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
