name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"

          if ! node -e "const semver = process.argv[1]; if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(semver)) process.exit(1)" "$tag_version"; then
            echo "Tag $GITHUB_REF_NAME must use npm semver format like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Validate package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          node - "$version" <<'NODE'
          const fs = require('node:fs');
          const expected = process.argv[2];
          const packagePaths = [
            'packages/core/package.json',
            'packages/cli/package.json',
          ];

          let failed = false;
          for (const packagePath of packagePaths) {
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            if (pkg.version !== expected) {
              console.error(`${pkg.name} is ${pkg.version}, but ${process.env.GITHUB_REF_NAME} expects ${expected}. Run pnpm changeset and merge the version PR before tagging.`);
              failed = true;
            } else {
              console.log(`${pkg.name}@${pkg.version}`);
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release availability
        id: availability
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${{ steps.release.outputs.version }}"

          cli_exists=false
          core_exists=false

          if npm view "tautest@$tag_version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            cli_exists=true
          fi

          if npm view "@tautest/core@$tag_version" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            core_exists=true
          fi

          if [ "$cli_exists" = true ] && [ "$core_exists" = true ]; then
            echo "tautest@$tag_version and @tautest/core@$tag_version already exist on npm; publish steps will be skipped."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$cli_exists" = true ] || [ "$core_exists" = true ]; then
            echo "Partial npm publish detected for $tag_version; refusing to continue automatically." >&2
            echo "tautest exists: $cli_exists" >&2
            echo "@tautest/core exists: $core_exists" >&2
            exit 1
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Pack npm packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tautest/release-packs
          pnpm --filter @tautest/core pack --pack-destination .tautest/release-packs
          pnpm --filter tautest pack --pack-destination .tautest/release-packs

      - name: Smoke packed npm packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          smoke_dir="$(mktemp -d)"
          pack_dir="$(pwd)/.tautest/release-packs"
          core_tgz="$(find "$pack_dir" -maxdepth 1 -name 'tautest-core-*.tgz' -print -quit)"
          cli_tgz="$(find "$pack_dir" -maxdepth 1 -name 'tautest-[0-9]*.tgz' -print -quit)"
          test -n "$core_tgz"
          test -n "$cli_tgz"

          cat > "$smoke_dir/package.json" <<JSON
          {
            "name": "tautest-publish-smoke",
            "private": true,
            "type": "module",
            "dependencies": {
              "@tautest/core": "file:$core_tgz",
              "tautest": "file:$cli_tgz"
            },
            "pnpm": {
              "overrides": {
                "@tautest/core": "file:$core_tgz"
              }
            }
          }
          JSON

          pnpm -C "$smoke_dir" install --ignore-scripts
          cli_version="$(pnpm -C "$smoke_dir" exec tautest --version)"
          if [ "$cli_version" != "$version" ]; then
            echo "Packed tautest CLI reported $cli_version, expected $version from $GITHUB_REF_NAME." >&2
            exit 1
          fi
          cd "$smoke_dir"
          node --input-type=module -e "import('@tautest/core').then((m) => { if (!m.buildMarkdownReport) throw new Error('missing core export'); })"

      - name: Publish @tautest/core
        if: steps.availability.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          core_tgz="$(find .tautest/release-packs -maxdepth 1 -name 'tautest-core-*.tgz' -print -quit)"
          npm publish "$core_tgz" --access public

      - name: Publish tautest
        if: steps.availability.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cli_tgz="$(find .tautest/release-packs -maxdepth 1 -name 'tautest-[0-9]*.tgz' -print -quit)"
          npm publish "$cli_tgz" --access public

      - name: Verify published packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"

          for attempt in {1..12}; do
            if npm view "tautest@$version" version --registry=https://registry.npmjs.org/ &&
               npm view "@tautest/core@$version" version --registry=https://registry.npmjs.org/; then
              exit 0
            fi

            echo "Published packages are not visible yet; retrying in 10 seconds ($attempt/12)."
            sleep 10
          done

          echo "Published packages were not visible on npm after waiting." >&2
          exit 1
