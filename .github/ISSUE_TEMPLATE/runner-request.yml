name: Runner or language support request
description: Request support for another test runner, framework, language, or mutation engine.
title: "[Runner]: "
labels:
  - runner-support
  - needs-triage
body:
  - type: dropdown
    id: request-kind
    attributes:
      label: Request type
      options:
        - JavaScript/TypeScript test runner
        - JavaScript/TypeScript framework
        - Python mutation support
        - Java mutation support
        - Other language
        - Other mutation engine
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool, framework, or language
      placeholder: "Mocha, Karma, Playwright, mutmut, PIT, pytest, Maven"
    validations:
      required: true
  - type: textarea
    id: project-shape
    attributes:
      label: Typical project shape
      description: Include package manager/build tool, config files, test command, and mutation command if one exists.
      render: text
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why this matters for your workflow
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Minimal example or public repository
    validations:
      required: false
